<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!--
    ============================================================
    CONTROLE DO MOTORISTA — Sistema Profissional de Gestão
    Arquivo: index.html
    Descrição: Estrutura semântica HTML5. Nenhum estilo ou script
                embutido — tudo é delegado para style.css e script.js.
    Arquitetura: Jamstack / GitHub Pages (100% estático)
    ============================================================
  -->

  <!-- Codificação universal de caracteres -->
  <meta charset="UTF-8" />

  <!-- Viewport responsivo essencial para dispositivos móveis.
       'width=device-width' garante que o layout use a largura real do aparelho.
       'initial-scale=1.0' impede o zoom automático indesejado do sistema.
       'viewport-fit=cover' estende o conteúdo até as bordas em telas com notch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Compatibilidade com Internet Explorer (fallback legado) -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Metadados de SEO e descrição da aplicação -->
  <meta name="description"
    content="Sistema Profissional de Gestão e Controle do Motorista. Relógio anti-fraude offline, 100% seguro e disponível em qualquer dispositivo." />
  <meta name="theme-color" content="#0d1b2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Controle Motorista" />

  <!-- Título exibido na aba do navegador e ao salvar como PWA na tela inicial -->
  <title>Controle do Motorista — Sistema Profissional de Gestão</title>

  <!-- ============================================================
       IMPORTAÇÃO DO ARQUIVO DE ESTILOS EXTERNO
       Deve ser carregado no <head> para evitar flash de conteúdo
       sem estilo (FOUC — Flash of Unstyled Content).
       ============================================================ -->
  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <!--
    NOTA PARA DESENVOLVEDORES:
    O JavaScript (script.js) injeta classes no <body> assim que carrega:
      - 'device-smartphone' para telefones
      - 'device-tablet'     para tablets
    O CSS reage automaticamente a essas classes para ajustar o layout.
    Nenhuma classe é definida aqui no HTML — o JS tem controle total.
  -->

  <!-- ============================================================
       CABEÇALHO PRINCIPAL — Área de Identidade do Sistema
       ============================================================ -->
  <!--
    CABEÇALHO + RELÓGIO: O header fica livre no topo (sem card).
    O relógio anti-fraude fica dentro do header, abaixo do subtítulo.
  -->
  <header class="app-header" role="banner">

    <!-- Título Principal -->
    <h1 class="app-title">Controle do Motorista</h1>

    <!-- Subtítulo: branco, centralizado -->
    <p class="app-subtitle">Sistema Profissional de Gestão</p>

    <!-- Linha de Informações: Data e Hora Lado a Lado com Tamanhos Proporcionais -->
    <div class="datetime-container">
      <span class="app-date" id="dataAtual" aria-label="Data atual">--</span>
      <span class="datetime-separator" aria-hidden="true">•</span>
      <div class="clock-container" id="clockContainer" role="timer" aria-live="off"
        aria-label="Relógio do sistema anti-fraude">
        <div class="clock-display" id="clockDisplay" aria-label="Horário atual">
          <span class="clock-segment" id="clockHours">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment" id="clockMinutes">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment clock-segment--seconds" id="clockSeconds">--</span>
        </div>
      </div>
    </div>

    <!-- Destaque do Botão Selecionado + Botão Voltar (Abaixo da hora e acima do card, centralizado) -->
    <div class="selected-badge-container" id="selectedBadgeContainer" aria-live="polite" style="display: none;">
      <span class="selected-badge" id="selectedBadge"></span>
      <button type="button" class="btn-voltar-topo" id="btnVoltarTopo" aria-label="Voltar para o card principal">
        Voltar
      </button>
    </div>

  </header>

  <!-- ============================================================
       SEÇÃO DE CARDS — Container Base (Fase Inicial)
       ============================================================ -->
  <main class="cards-container" id="cardsContainer" role="main">

    <!--
      CARD BASE — Com o botão Escala e grid para futuras ações
    -->
    <article class="card card--base" id="cardBase" aria-label="Módulo de gestão">
      <div class="card-buttons-grid">
        <a href="escala.html" class="btn-card-action" id="btnEscala" data-nome="Escala">
          Escala
        </a>
        <a href="jornada.html" class="btn-card-action" id="btnControleJornada" data-nome="Controle Jornada">
          Controle Jornada
        </a>
        <a href="linhas.html" class="btn-card-action" id="btnLinhas" data-nome="Linhas">
          Linhas
        </a>
        <a href="motorista.html" class="btn-card-action" id="btnMotoristas" data-nome="Motoristas">
          Motoristas
        </a>
        <a href="carros.html" class="btn-card-action" id="btnCarros" data-nome="Carros">
          Carros
        </a>
      </div>
    </article>

  </main>

  <!-- ============================================================
       RODAPÉ DA APLICAÇÃO
       ============================================================ -->
  <footer class="app-footer" role="contentinfo">
    <p class="app-footer__text">
      &copy; <span id="footerYear"></span> Auto Viação Reginas —
      <span class="app-footer__version">v2.0.0</span>
    </p>
  </footer>

  <!-- ============================================================
       IMPORTAÇÃO DOS SCRIPTS MODULARES
       1. versao.js: Controle centralizado de versão do sistema
       2. relogio.js: Motor anti-fraude blindado e independente
       3. script.js: Lógica de negócio e responsividade
       'defer' garante execução na ordem após o parse do DOM.
       ============================================================ -->
  <script src="versao.js" defer></script>
  <script src="relogio.js" defer></script>
  <script src="script.js" defer></script>

</body>

</html>
