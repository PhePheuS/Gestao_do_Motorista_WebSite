<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!--
    ============================================================
    CONTROLE DO MOTORISTA — Sistema Profissional de Gestão
    Arquivo: escala.html (Módulo de Escala)
    Descrição: Página dedicada ao gerenciamento e visualização da Escala.
    Arquitetura: Jamstack / GitHub Pages (100% estático)
    ============================================================
  -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <meta name="description" content="Módulo de Escala — Controle do Motorista. Auto Viação Reginas." />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Escala Motorista" />

  <title>Controle do Motorista — Escala</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================================================
       CABEÇALHO PRINCIPAL — Identidade, Data/Hora e Navegação
       ============================================================ -->
  <header class="app-header" role="banner">

    <!-- Título Principal -->
    <h1 class="app-title">Controle do Motorista</h1>

    <!-- Subtítulo: branco, centralizado -->
    <p class="app-subtitle">Sistema Profissional de Gestão</p>

    <!-- Linha de Informações: Data e Hora Lado a Lado -->
    <div class="datetime-container">
      <span class="app-date" id="dataAtual" aria-label="Data atual">--</span>
      <span class="datetime-separator" aria-hidden="true">•</span>
      <div class="clock-container" id="clockContainer" role="timer" aria-live="off" aria-label="Relógio do sistema anti-fraude">
        <div class="clock-display" id="clockDisplay" aria-label="Horário atual">
          <span class="clock-segment" id="clockHours">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment" id="clockMinutes">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment clock-segment--seconds" id="clockSeconds">--</span>
        </div>
      </div>
    </div>

    <!-- Ações e Destaque do Topo: INSERIR, ESCALA e VOLTAR em Caixa Alta e Espaçamento Aumentado -->
    <div class="selected-badge-container" id="selectedBadgeContainer" aria-live="polite">
      <div class="topo-acoes-linha">
        <button type="submit" form="formInserirEscala" class="btn-inserir-topo" id="btnInserirEscala" aria-label="Inserir dados na escala">
          INSERIR
        </button>
        <span class="selected-badge" id="selectedBadge">ESCALA</span>
        <a href="index.html" class="btn-voltar-topo" id="btnVoltarTopo" aria-label="Voltar para a tela inicial">
          VOLTAR
        </a>
      </div>
    </div>

  </header>

  <!-- ============================================================
       SEÇÃO DE CARDS — Módulo de Escala
       ============================================================ -->
  <main class="cards-container" id="cardsContainer" role="main">

    <!-- Barra de Campos Acima do Card (Data, Horário, Local Saída, Matrícula, Motorista) -->
    <section class="barra-inserir-container" aria-label="Campos de inserção da escala">
      <form id="formInserirEscala" class="form-escala-wrapper">
        <!-- Linha 1: Data, Linha, Nome da Linha -->
        <div class="form-escala-row form-escala-row--top">
          <input type="text" id="inputData" class="input-escala col-data" placeholder="Data" maxlength="10" required />
          <input type="text" id="inputLinhaNumero" class="input-escala col-linha-num" placeholder="Linha" maxlength="10" required />
          <input type="text" id="inputLinhaNome" class="input-escala col-linha-nome" placeholder="Nome da Linha" readonly />
        </div>
        <!-- Linha 2: Horário, Local Saída, Matrícula, Motorista -->
        <div class="form-escala-row form-escala-row--bottom">
          <input type="text" id="inputHorario" class="input-escala col-hora" placeholder="Horário" maxlength="5" required />
          <input type="text" id="inputLocalSaida" class="input-escala col-local" placeholder="Local Saída" required />
          <input type="text" id="inputMatricula" class="input-escala col-mat" placeholder="Matrícula" required />
          <input type="text" id="inputMotorista" class="input-escala col-motorista" placeholder="Motorista" required />
        </div>
      </form>
    </section>

    <!--
      CARD BASE VAZIO — Onde os registros da escala serão exibidos
    -->
    <article class="card card--base card--escala" id="cardBase" aria-label="Módulo de Escala">
      <div id="listaEscalaContainer" class="lista-escala-container">
        <!-- Itens inseridos aparecem aqui -->
      </div>
    </article>

  </main>

  <!-- ============================================================
       RODAPÉ DA APLICAÇÃO
       ============================================================ -->
  <footer class="app-footer" role="contentinfo">
    <p class="app-footer__text">
      &copy; <span id="footerYear"></span> Auto Viação Reginas —
      <span class="app-footer__version">v2.0.0</span>
    </p>
  </footer>

  <!-- ============================================================
       IMPORTAÇÃO DOS SCRIPTS MODULARES
       ============================================================ -->
  <script src="versao.js" defer></script>
  <script src="relogio.js" defer></script>
  <script src="script.js" defer></script>

</body>

</html>
