<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!--
    ============================================================
    CONTROLE DO MOTORISTA — Sistema Profissional de Gestão
    Arquivo: motorista.html (Módulo de Motoristas)
    Descrição: Cadastro de motoristas (matrícula + nome) para uso
               compartilhado em todos os módulos do sistema.
    Arquitetura: Jamstack / GitHub Pages (100% estático)
    ============================================================
  -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <meta name="description" content="Módulo de Motoristas — Controle do Motorista. Gestor Motorista." />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Motoristas" />

  <title>Controle do Motorista — Motoristas</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================================================
       CABEÇALHO PRINCIPAL — Identidade, Data/Hora e Navegação
       ============================================================ -->
  <header class="app-header" role="banner">

    <!-- Título Principal -->
    <h1 class="app-title">Controle do Motorista</h1>

    <!-- Subtítulo: branco, centralizado -->
    <p class="app-subtitle">Sistema Profissional de Gestão</p>

    <!-- Linha de Informações: Data e Hora Lado a Lado -->
    <div class="datetime-container">
      <span class="app-date" id="dataAtual" aria-label="Data atual">--</span>
      <span class="datetime-separator" aria-hidden="true">•</span>
      <div class="clock-container" id="clockContainer" role="timer" aria-live="off" aria-label="Relógio do sistema anti-fraude">
        <div class="clock-display" id="clockDisplay" aria-label="Horário atual">
          <span class="clock-segment" id="clockHours">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment" id="clockMinutes">--</span>
          <span class="clock-separator" aria-hidden="true">:</span>
          <span class="clock-segment clock-segment--seconds" id="clockSeconds">--</span>
        </div>
      </div>
    </div>

    <!-- Ações e Destaque do Topo: Linha 1 (Motorista), Linha 2 (Voltar, Inserir) -->
    <div class="selected-badge-container" id="selectedBadgeContainer" aria-live="polite">
      <span class="selected-badge" id="selectedBadge">MOTORISTA</span>
      <div class="topo-acoes-linha">
        <a href="index.html" class="btn-voltar-topo" id="btnVoltarTopo" aria-label="Voltar para a tela inicial">
          VOLTAR
        </a>
        <button type="submit" form="formInserirMotorista" class="btn-inserir-topo" id="btnInserirMotorista" aria-label="Inserir motorista">
          INSERIR
        </button>
      </div>
    </div>

  </header>

  <!-- ============================================================
       SEÇÃO DE CARDS — Módulo de Motoristas
       ============================================================ -->
  <main class="cards-container" id="cardsContainer" role="main">

    <!-- Barra de Campos: Matrícula e Nome do Motorista -->
    <section class="barra-inserir-container" aria-label="Campos de cadastro de motoristas">
      <form id="formInserirMotorista" class="form-escala-wrapper">
        <div class="form-escala-row form-motoristas-row">
          <input type="text" id="inputMotMatricula" class="input-escala col-mot-matricula" placeholder="Matrícula" required />
          <input type="text" id="inputMotNome" class="input-escala col-mot-nome" placeholder="Nome do Motorista" required />
        </div>
      </form>
    </section>

    <!-- CARD BASE — Onde os motoristas cadastrados serão exibidos -->
    <article class="card card--base card--escala" id="cardBase" aria-label="Módulo de Motoristas">
      <div id="listaMotoristasContainer" class="lista-escala-container">
        <!-- Itens inseridos aparecem aqui -->
      </div>
    </article>

  </main>

  <!-- ============================================================
       RODAPÉ DA APLICAÇÃO
       ============================================================ -->
  <footer class="app-footer" role="contentinfo">
    <p class="app-footer__text">
      &copy; <span id="footerYear"></span> Gestor Motorista —
      <span class="app-footer__version">v2.0.0</span>
    </p>
  </footer>

  <!-- ============================================================
       IMPORTAÇÃO DOS SCRIPTS MODULARES
       ============================================================ -->
  <script src="versao.js" defer></script>
  <script src="relogio.js" defer></script>
  <script src="script.js" defer></script>

</body>

</html>
